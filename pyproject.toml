[project]
name = "attention-phone"
version = "0.1.0"
description = "Phone sensors (accelerometer, gyro, attitude, …) streamed onto the laptop for the tuning-attention class. Companion to attention-cv."
readme = "README.md"
authors = [
    { name = "Jon Myers", email = "jonmyers@mit.edu" }
]
requires-python = ">=3.13"
dependencies = [
    # HTTP + WebSocket + TLS in one dependency, so the sender page, the
    # Sensor Logger push endpoint and the socket all live on one port.
    "aiohttp>=3.10",
    # Pure-python QR codes, no C deps: the only sane way to get 20 phones
    # onto a URL like https://10-0-0-184.local-ip.sh:8443 in under a minute.
    "segno>=1.6",
]

[project.scripts]
phone-demo = "attention_phone.phone_demo:main"
phone-cert = "attention_phone.certs:main"
fake-phone = "attention_phone.fake_phone:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
