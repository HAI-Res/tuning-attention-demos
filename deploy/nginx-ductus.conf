# /etc/nginx/sites-available/ductus — TLS in front of phone-demo.
#
# Two things differ from an ordinary reverse proxy, and both matter:
#
# 1. /ws and /feed are WebSockets. Without the Upgrade/Connection headers nginx
#    answers the handshake itself and every phone reads "Not reaching the
#    laptop". Without a long proxy_read_timeout nginx closes any stream that is
#    quiet for 60 s — the relay's feed is quiet whenever no phone is moving.
# 2. X-Forwarded-Proto: aiohttp sees plain HTTP behind here, and /app uses this
#    to hand the iOS app tls=1 rather than tls=0.
# Sets Connection: upgrade only when the client asked for an upgrade. `map`
# must sit at http level, so it comes before any server block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ductus-web-app.csail.mit.edu;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;        # nginx 1.24 syntax (Ubuntu 24.04); 1.25+ prefers `http2 on;`
    listen [::]:443 ssl http2;
    server_name ductus-web-app.csail.mit.edu;

    ssl_certificate     /etc/letsencrypt/live/ductus-web-app.csail.mit.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ductus-web-app.csail.mit.edu/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade, harmless on plain requests.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
